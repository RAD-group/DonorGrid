spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bloodbank}
spring.datasource.username=${DB_USERNAME:blooduser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# No default: the backend refuses to start without a JWT secret of at least 32 characters
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.port=8080
